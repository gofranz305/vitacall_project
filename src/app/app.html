<!-- Master Viewport Container -->
<div class="min-h-screen flex flex-col bg-slate-100 text-slate-800 antialiased font-sans transition-all duration-300"
  [ngClass]="isHandsetView() ? 'py-8 px-4 flex items-center justify-center bg-slate-900' : ''">

  <!-- If Handset View on Desktop: Mockup Phone Frame -->
  <div class="w-full transition-all duration-300 flex flex-col min-h-screen"
    [ngClass]="isHandsetView() ? 'max-w-sm rounded-[42px] border-[10px] border-slate-800 shadow-2xl bg-white overflow-hidden min-h-[820px] max-h-[880px]' : ''">

    <!-- Top System Navbar -->
    <app-navbar />

    <!-- Toast Notifications Container -->
    <app-toast-container />

    <!-- Routed Page Content -->
    <main class="flex-1 w-full bg-slate-50/50 overflow-y-auto">
      <router-outlet />
    </main>

    <!-- Mobile-First Bottom Nav (Ergonomic Phone Thumb Bar) -->
    <app-bottom-nav />

    <!-- Institutional Footer & Academic Attribution -->
    <footer class="bg-slate-900 text-slate-400 py-6 px-4 text-xs border-t border-slate-800 shrink-0"
      [ngClass]="isHandsetView() ? 'hidden' : 'block'">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2.5">
          <div
            class="w-7 h-7 rounded-lg bg-teal-600 text-white flex items-center justify-center text-sm shadow-xs font-bold">
            🩺
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="text-white font-bold text-sm">VitaCall</span>
              <span class="px-2 py-0.5 rounded bg-teal-500/20 text-teal-400 font-semibold text-[10px]">Campus
                Health</span>
            </div>
            <p class="text-[11px] text-slate-500 mt-0.5">
              Boarding Student Health Request & Monitoring System
            </p>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-3 text-[11px]">
          <span class="px-2.5 py-1 rounded-full bg-slate-800 text-teal-300 border border-slate-700">
            🔒 IAS Role-Based Access Control
          </span>
          <span class="px-2.5 py-1 rounded-full bg-slate-800 text-emerald-300 border border-slate-700">
            🛡️ Tamper-Resistant Certificates
          </span>
          <button type="button" (click)="toggleHandsetView()"
            class="hidden md:inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-teal-600 hover:bg-teal-500 text-white font-semibold transition-colors cursor-pointer">
            <span>📱 Toggle Mobile View</span>
          </button>
        </div>
      </div>
    </footer>

  </div>

  <!-- Floating Mobile Handset View Toggle for Desktop Evaluation -->
  <div class="hidden md:block fixed bottom-6 right-6 z-50">
    <button type="button" (click)="toggleHandsetView()"
      class="flex items-center gap-2 px-4 py-2.5 rounded-full shadow-2xl font-bold text-xs transition-all transform hover:scale-105"
      [ngClass]="isHandsetView() ? 'bg-white text-slate-900 border border-slate-300' : 'bg-gradient-to-r from-teal-600 to-emerald-600 text-white ring-4 ring-teal-500/20'"
      title="Toggle between standard wide-screen and mobile smartphone handset viewport">
      <span>{{ isHandsetView() ? '💻 Switch to Desktop View' : '📱 Switch to Mobile Phone View' }}</span>
    </button>
  </div>

</div>
